[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.5"
description = "WORKSPACE VM orchestration system with shared code quality infrastructure"
readme = "README.md"
requires-python = "==3.13.*"
license = {text = "MIT"}
authors = [{name = "WORKSPACE Team", email = "team@workspace.local"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "uuid-utils==1.0.0",
    "loguru==0.7.3",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "click==8.5.0",
    "setuptools==84.0.0",
    "python-dotenv==1.2.3",
    "prometheus-client==0.26.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "nodeenv==1.10.0",
    "playwright==1.63.0",
    "synadm==0.49.2",
    "google-auth==2.58.0",
    "google-auth-oauthlib==1.4.1",
    "google-api-python-client==2.200.0",
    "tqdm==4.70.1",
    "zstandard==0.25.0",
    "pyahocorasick==2.3.1",
    "podman-compose==1.6.0",
    "art==6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
xfail_strict = true
# `-n 1` runs the suite in a single xdist worker process so test bodies
# execute outside the main pytest interpreter. Without this, coverage.py's
# C tracer plus the YAML-loading test
# tests/integration/test_hooks_integration.py::TestHookIntegration::test_tier_scope_override_elevates
# segfault when run in the same process. Costs one fork; restores
# deterministic test runs under `--cov`.
addopts = "-n 1"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace.*"]
namespaces = true

[project.optional-dependencies]
chat = [
    "matrix-nio==0.26.0",
    "matrix-commander==8.0.6",
]
dev = [
    "dataops",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = true

[tool.uv.sources]
dataops = { path = "projects/WORKSPACE-DATAOPS", editable = true }

[tool.mypy]
# Shared config at /opt/workspace-ci/mypy.toml (passed via --config-file in
# Makefile and .pre-commit-config.yaml). This section adds VM-specific
# merge keys: exclude projects/ (nested repos have their own type-check).
# MYPYPATH=".:projects/WORKSPACE-DATAOPS" is set in the Makefile
# because mypy cannot resolve PEP 660 editable installs (mypy#12313).
exclude = [
    "projects/",
    "tests/",
]
explicit_package_bases = true
