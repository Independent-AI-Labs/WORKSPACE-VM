---
- name: Validate llama_server_path exists
  ansible.builtin.stat:
    path: "{{ llama_server_path }}"
  register: server_bin

- name: Validate llama_model_path exists
  ansible.builtin.stat:
    path: "{{ llama_model_path }}"
  register: model_file

- name: Ensure llamaserver config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/llamaserver"
    state: directory
    mode: '0755'

- name: Ensure systemd user directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Load API key from .env
  ansible.builtin.set_fact:
    llama_api_key: "{{ lookup('env', 'LLAMA_API_KEY') }}"

- name: Deploy llamaserver EnvironmentFile
  ansible.builtin.copy:
    content: |
      LLAMA_API_KEY={{ llama_api_key }}
    dest: "{{ ansible_env.HOME }}/.config/llamaserver/llamaserver-vulkan.env"
    mode: '0600'
    backup: false

- name: Deploy llamaserver-vulkan user systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=LlamaServer Vulkan (Qwen3.6-35B-A3B MoE, ~200K context, dual Arc A770)
      After=network.target

      [Service]
      Type=simple
      ExecStart={{ llama_server_path }} \
          -m {{ llama_model_path }} \
          -c {{ llama_context_size }} \
          -ngl {{ llama_gpu_layers }} \
          --host {{ llama_server_host }} \
          --port {{ llama_server_port }} \
          -t 4 \
          --fit off \
          -np 1 \
          --api-key ${LLAMA_API_KEY}
      Environment=LD_LIBRARY_PATH={{ vulkan_build_lib }}:{{ ansible_env.LD_LIBRARY_PATH | default('') }}
      EnvironmentFile={{ ansible_env.HOME }}/.config/llamaserver/llamaserver-vulkan.env
      StandardOutput=journal
      StandardError=journal
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=default.target
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ llama_service_name }}.service"
    mode: '0644'
    backup: false

- name: Daemon-reload systemd user instance
  ansible.builtin.command: systemctl --user daemon-reload
  changed_when: true

- name: Enable and start llamaserver-vulkan user service
  ansible.builtin.command: systemctl --user enable --now {{ llama_service_name }}.service
  changed_when: true