extensions:
  - name: kcadm
    binary: workspace/scripts/bin/kcadm
    description: Keycloak Identity Management CLI
    category: enterprise
    features:
      - config
      - get
      - create
      - update
      - delete
    bannerPriority: 130
    container: workspace-keycloak
    installHint: "make compose-deploy in WORKSPACE-DATAOPS"
    check:
      command: ["{binary}", "--version"]
      versionPattern: "(\\d+\\.\\d+\\.\\d+)"
      healthExpect: "."
      timeout: 5
    deps:
      - name: workspace-keycloak
        type: container
        container: workspace-keycloak
        required: false

  - name: browser
    binary: workspace/scripts/bin/browser
    description: Chromium automation CLI (WORKSPACE-BROWSER wsb)
    category: research
    features:
      - session
      - navigate
      - interact
      - inspect
      - extract
      - capture
      - execute
      - storage
      - profile
    bannerPriority: 420
    installHint: "make setup in projects/WORKSPACE-BROWSER"
    deps:
      - name: workspace-browser-build
        type: file
        path: projects/WORKSPACE-BROWSER/dist/cli/main.js
        required: true
    check:
      command: ["{binary}", "--help"]
      healthExpect: "workspace-browser"
      timeout: 5
