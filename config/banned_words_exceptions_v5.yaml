  # bootstrap.sh installs the uv-managed interpreter by name.
  - rule: protected-bare-system-interpreter
    path: ^workspace/scripts/setup/bootstrap\.sh$
    rationale: Invokes the uv binary's own interpreter-install subcommand.
    owner: workspace-vm
    review_date: '2026-09-10'
    removal: Remove if the bootstrap flow changes.
  # moon project tag filtering uses the `python` tag as data.
  - rule: protected-bare-system-interpreter
    path: ^scripts/setup/test_install_e2e_moon_phases\.sh$
    rationale: moon `--tags python` is a project-tag identifier, not an invocation.
    owner: workspace-vm
    review_date: '2026-09-10'
    removal: Remove if the moon tag is renamed.
  # Test asserts wrapper scripts rewrite .venv interpreter paths.
  - rule: venv-bin-python
