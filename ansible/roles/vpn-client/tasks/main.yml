---
- name: Install workspace OpenVPN host service
  ansible.builtin.shell: >
    bash "{{ playbook_dir }}/../workspace/scripts/bootstrap/bootstrap_openvpn_service.sh"
    "{{ playbook_dir }}/.." >> /tmp/workspace-openvpn-service-install.log 2>&1
  register: _openvpn_service_install
  changed_when: true

- name: Display OpenVPN service install output
  ansible.builtin.debug:
    var: _openvpn_service_install.stdout_lines