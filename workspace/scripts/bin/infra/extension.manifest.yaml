extensions:
  - name: vpn
    binary: workspace/scripts/bin/vpn
    description: Workspace OpenVPN host client (install/start/stop/health)
    category: infra
    features:
      - install
      - start/stop/restart
      - persist-on/off/status
      - PERSIST=1|0 on start/stop
      - make vpn-install|vpn-start|vpn-health
    hidden: true
    bannerPriority: 310
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "openvpn"
      timeout: 5

  - name: tunnel
    binary: workspace/scripts/bin/tunnel.py
    description: Cloudflare tunnel management
    category: infra
    features:
      - tunnel
      - access
      - login
      - service
    hidden: true
    bannerPriority: 320
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "tunnel"
      timeout: 5

  - name: ssl
    binary: workspace/scripts/bin/openssl.py
    description: OpenSSL with AMI cert paths
    category: infra
    features:
      - x509
      - req
      - genrsa
      - s_client
      - verify
    hidden: true
    bannerPriority: 330
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "ssl"
      timeout: 5
