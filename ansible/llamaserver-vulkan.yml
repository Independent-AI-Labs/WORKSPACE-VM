--
- name: Deploy Vulkan LlamaServer with systemd
  hosts: localhost
  gather_facts: true

  roles:
    - llamaserver-vulkan

  vars:
    llama_server_path: "{{ playbook_dir }}/../projects/llama.cpp/build-vulkan/bin/llama-server"
    llama_model_path: /home/workspace/WORKSPACE-VM/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    llama_server_host: 127.0.0.1
    llama_server_port: 8080
    llama_context_size: 200000
    llama_gpu_layers: 99
    llama_service_name: llamaserver-vulkan
    vulkan_build_lib: "{{ playbook_dir }}/../projects/llama.cpp/build-vulkan/lib"