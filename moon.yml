# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# moon project config for ami-agents (workspace umbrella repo).
# Workspace-level overlay only — see projects/docs/MOON-MIGRATION-PLAN.md.
# Per-repo tasks (lint, test, build, install, etc.) live in the Makefile
# and are invoked directly when working inside this repo. moon does not
# duplicate them.

$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'ami-agents'
  description: 'AMI workspace umbrella repo and Python orchestrator'

language: 'python'
layer: 'unknown'

tags:
  - 'umbrella'
  - 'python'

# Workspace clone manifest lives in ami/config/workspace-clones.yaml
# (moon.yml schema doesn't accept arbitrary top-level metadata fields).
# That separate file is the single source of truth for "what repos
# belong to the AMI workspace" — read by ami/scripts/bin/ami-bootstrap-repos.

dependsOn:
  - 'ami-ci'
  - 'ami-dataops'

tasks:
  lint:
    command: 'make _lint-impl'
    inputs:
      - 'ami/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'pyproject.toml'
      - 'res/config/ruff.toml'
      - 'Makefile'
  type-check:
    command: 'make _type-check-impl'
    inputs:
      - 'ami/**/*.py'
      - 'pyproject.toml'
      - 'res/config/mypy.toml'
      - 'Makefile'
  test:
    command: 'make _test-impl'
    inputs:
      - 'ami/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'res/**/*'
      - 'pyproject.toml'
      - 'Makefile'
  dead-code:
    command: 'make _dead-code-impl'
    inputs:
      - 'ami/**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
  check:
    # Aggregator: deps fan out via moon's task DAG; command is a no-op
    # to avoid recursing back through the public make check shim.
    command: 'true'
    deps:
      - '~:lint'
      - '~:type-check'
      - '~:test'
  ci:
    command: 'make check'
    deps:
      - '~:check'
  update:
    command: 'bash -c "git pull --ff-only 2>/dev/null || true && make sync"'
    deps:
      - '^:update'
    options:
      cache: false
      runDepsInParallel: false
