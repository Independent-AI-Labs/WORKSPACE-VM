[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace"
version = "0.4"
description = "AMI Agent Orchestration System with shared code quality infrastructure"
readme = "README.md"
requires-python = "==3.13.*"
license = {text = "MIT"}
authors = [{name = "AMI Team", email = "ami@example.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "uuid-utils==0.17.0",
    "loguru==0.7.3",
    "pandas==2.2.3",
    "numpy==2.5.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "click==8.4.2",
    "setuptools==80.10.2",
    "python-dotenv==1.2.2",
    "prometheus-client==0.25.0",
    "fastapi==0.139.2",
    "jinja2==3.1.6",
    "uvicorn[standard]==0.51.0",
    "python-multipart==0.0.32",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "nodeenv==1.10.0",
    "playwright==1.61.0",
    "synadm==0.49.2",
    "google-auth==2.56.1",
    "google-auth-oauthlib==1.4.0",
    "google-api-python-client==2.198.0",
    "tqdm==4.67.3",
    "zstandard==0.25.0",
    "pyahocorasick==2.3.1",
    "podman-compose==1.6.0",
    "art==6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
xfail_strict = true
# `-n 1` runs the suite in a single xdist worker process so test bodies
# execute outside the main pytest interpreter. Without this, coverage.py's
# C tracer plus the YAML-loading test
# tests/integration/test_hooks_integration.py::TestHookIntegration::test_tier_scope_override_elevates
# segfault when run in the same process. Costs one fork; restores
# deterministic test runs under `--cov`.
addopts = "-n 1"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace.*"]
namespaces = true

[tool.setuptools.package-data]
ami = []

[project.optional-dependencies]
chat = [
    "matrix-nio==0.25.2",
    "matrix-commander==8.0.6",
]
dev = [
    "workspace-ci[dev]",
    "dataops",
]

[tool.uv]
package = true

[tool.uv.sources]
workspace-ci = { path = "projects/CI", editable = true }
dataops = { path = "projects/DATAOPS", editable = true }

[tool.mypy]
# Shared config at projects/CI/mypy.toml (passed via --config-file in
# Makefile and .pre-commit-config.yaml). This section adds VM-specific
# merge keys: exclude projects/ (nested repos have their own type-check).
# MYPYPATH=".:projects/DATAOPS" is set in Makefile and .pre-commit-config.yaml
# because mypy cannot resolve PEP 660 editable installs (mypy#12313).
exclude = [
    "projects/",
    "tests/",
]
explicit_package_bases = true

