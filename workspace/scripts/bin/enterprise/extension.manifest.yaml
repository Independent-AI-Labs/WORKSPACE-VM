extensions:
  - name: kcadm
    binary: workspace/scripts/bin/kcadm
    description: Keycloak Identity Management CLI
    category: enterprise
    features:
      - config
      - get
      - create
      - update
      - delete
    bannerPriority: 130
    container: workspace-keycloak
    installHint: "make compose-deploy in WORKSPACE-DATAOPS"
    check:
      command: ["{binary}", "--version"]
      versionPattern: "(\\d+\\.\\d+\\.\\d+)"
      healthExpect: "."
      timeout: 5
    deps:
      - name: workspace-keycloak
        type: container
        container: workspace-keycloak
        required: false

  - name: browser
    binary: .venv/bin/playwright
    description: Browser automation (Playwright)
    category: research
    features:
      - open
      - codegen
      - screenshot
      - pdf
      - install
    bannerPriority: 420
    check:
      command: ["{binary}", "--version"]
      versionPattern: "(\\d+\\.\\d+\\.\\d+)"
      healthExpect: "."
      timeout: 5
