extensions:
  - name: vpn
    binary: workspace/scripts/bin/run_openvpn_client.py
    description: OpenVPN client with AMI config
    category: infra
    features:
      - --ovpn-file
      - --action start/health
      - --daemon
    hidden: true
    bannerPriority: 310
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "openvpn"
      timeout: 5

  - name: tunnel
    binary: workspace/scripts/bin/tunnel.py
    description: Cloudflare tunnel management
    category: infra
    features:
      - tunnel
      - access
      - login
      - service
    hidden: true
    bannerPriority: 320
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "tunnel"
      timeout: 5

  - name: ssl
    binary: workspace/scripts/bin/openssl.py
    description: OpenSSL with AMI cert paths
    category: infra
    features:
      - x509
      - req
      - genrsa
      - s_client
      - verify
    hidden: true
    bannerPriority: 330
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "ssl"
      timeout: 5
