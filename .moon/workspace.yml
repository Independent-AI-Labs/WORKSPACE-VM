# yaml-language-server: $schema=https://moonrepo.dev/schemas/workspace.json
#
# WORKSPACE-VM workspace: moon (moonrepo) configuration.
#
# moon is the task runner + project-graph dep validator for the federated
# AMI workspace. Each project below is a separate sibling git repo under
# $AMI_ROOT/projects/, except `workspace` which is the umbrella
# repo at the workspace root.
#
# Per-project `moon.yml` files live inside each repo and declare:
#   - language / type
#   - dependsOn (cross-AMI edges, validated by `moon ci`)
#   - tasks (typically thin wrappers over each repo's existing `make` targets)
#
# Toolchain is intentionally NOT managed by moon. We have our own
# `.boot-linux/` toolchain bootstrap; per-project `moon.yml` may set
# language hints for the graph but moon will not auto-install runtimes.

# Project discovery: globs auto-discover any project with a moon.yml
# under projects/. Optional repos (workspace-portal, ami-srp, etc.)
# are only registered when actually cloned, avoiding "missing source"
# errors for repos that workspace-clones.yaml declares optional.
# Mandatory repos are listed explicitly in sources so their IDs stay
# lowercase (matching dependsOn references) rather than inheriting the
# uppercase folder name from globs. On collision, sources entries win
# and the glob entry is skipped (documented moon behavior).
# The umbrella repo (workspace) is in sources since its moon.yml lives
# at the workspace root, not under projects/.
# workspace-clones.yaml remains the authoritative source for git clone
# orchestration (remote URLs, mandatory/optional, minTag): that is a
# separate concern from project-graph discovery.
projects:
  globs:
    - 'projects/*/moon.yml'
  sources:
    workspace: '.'
    ci: 'projects/CI'
    dataops: 'projects/DATAOPS'
    workspace-guard: 'projects/WORKSPACE-GUARD'
    workspace-portal: 'projects/WORKSPACE-PORTAL'
    workspace-streams: 'projects/WORKSPACE-STREAMS'

vcs:
  client: 'git'
  defaultBranch: 'main'

pipeline:
  cacheLifetime: '7 days'

# Disable telemetry: see CLAUDE.md guidance.
telemetry: false

