# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# moon project config for workspace (workspace umbrella repo).
# Workspace-level overlay only - see projects/docs/MOON-MIGRATION-PLAN.md.
# Per-repo tasks (lint, test, build, install, etc.) live in the Makefile
# and are invoked directly when working inside this repo. moon does not
# duplicate them.

$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'workspace'
  description: 'WORKSPACE umbrella repo and Python orchestrator'
  inherited_boot_dirs:
    - '/opt/workspace-ci'

language: 'python'
layer: 'unknown'

tags:
  - 'umbrella'
  - 'python'

# Workspace clone manifest lives in workspace/config/workspace-clones.yaml
# (moon.yml schema doesn't accept arbitrary top-level metadata fields).
# That separate file is the single source of truth for "what repos
# belong to the WORKSPACE workspace" - read by workspace/scripts/bin/bootstrap-repos.

dependsOn:
  - 'workspace-ci'
  - 'workspace-dataops'

tasks:
  lint:
    command: 'make _lint-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'pyproject.toml'
      - 'Makefile'
  type-check:
    command: 'make _type-check-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
  test:
    command: 'make _test-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'res/**/*'
      - 'pyproject.toml'
      - 'Makefile'
      - 'workspace/agentci/package.json'
      - 'workspace/agentci/package-lock.json'
      - 'workspace/agentci/tsconfig.json'
      - 'workspace/agentci/tsconfig.build.json'
      - 'workspace/agentci/src/**/*.ts'
      - 'workspace/agentci/tests/**/*.ts'
      - 'workspace/scripts/bin/oc'
      - 'workspace/scripts/opencode-wrapper.sh'
      - 'workspace/config/opencode/opencode.jsonc'
      - 'workspace/config/opencode/system-instruction.template.md'
  dead-code:
    command: 'make _dead-code-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
  check:
    # Aggregator: deps fan out via moon's task DAG; command is a no-op
    # to avoid recursing back through the public make check wrapper.
    command: 'true'
    deps:
      - '~:lint'
      - '~:type-check'
      - '~:test'
  ci:
    command: 'make check'
    deps:
      - '~:check'
  update:
    command: 'bash -c "rc=0; git pull --ff-only || rc=$$rc; if [ $$rc -ne 0 ]; then echo \"git pull failed (rc=$$rc): continuing with make sync\" >&2; fi && make sync"'
    deps:
      - '^:update'
    options:
      cache: false
      runDepsInParallel: false
