extensions:
  - name: docs
    binary: ami/scripts/bin/docs.py
    description: Document conversion and PDF generation
    category: research
    features:
      - pandoc
      - wkhtmltopdf
      - pdflatex
      - xelatex
      - pdfjam
    bannerPriority: 410
    check:
      command: ["{python}", "{binary}", "--help"]
      healthExpect: "docs"
      timeout: 5
