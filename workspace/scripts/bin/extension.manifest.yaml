extensions:
  - name: oc
    binary: workspace/scripts/bin/oc
    description: opencode AI agent wrapper with AMI welcome context
    category: core
    features:
      - run
      - session
    bannerPriority: 10
    check:
      command: ["{binary}", "--version"]
      versionPattern: "(\\d+\\.\\d+\\.\\d+)"
      healthExpect: "."
      timeout: 5

  - name: run
    binary: workspace/scripts/bin/run
    description: Universal project execution wrapper
    category: core
    features:
      - python
      - uv
      - node
      - npm
      - npx
      - bash
      - sh
      - rustc
      - cargo
      - go
      - tests
      - extras
      - doctor
    bannerPriority: 30
    check:
      command: ["{binary}", "--help"]
      healthExpect: "run"
      timeout: 5

  - name: ops
    binary: workspace/scripts/bin/ops
    description: System orchestration and container management
    category: infra
    features:
      - podman
      - systemd
      - ansible
      - ansible-playbook
      - ansible-galaxy
      - kubectl
      - helm
      - status
      - storage
      - cron
    bannerPriority: 35
    check:
      command: ["{binary}", "--help"]
      healthExpect: "ops"
      timeout: 5

  - name: repo
    binary: workspace/scripts/bin/repo
    description: Git repository and server management
    category: core
    features:
      - git
      - gh
      - hf
      - glab
      - status-all
      - gitd
      - serve
    bannerPriority: 40
    check:
      command: ["{binary}", "--help"]
      healthExpect: "repo"
      timeout: 5

  # ami-update extension removed: the umbrella orchestration now lives
  # in moon via `moon run :update` (walks every project's update task
  # in topological order through ^:update). Use `make update` from the
  # workspace root or `moon run :update` directly. See
  # `kind-weaving-kahan` plan / MOON-MIGRATION-PLAN.md v0.2.0 Phase 6.

  - name: welcome
    binary: workspace/scripts/bin/welcome
    description: Print the AMI Orchestrator banner
    category: core
    hidden: true
    bannerPriority: 60
    check:
      command: ["{binary}", "--help"]
      healthExpect: "welcome"
      timeout: 5

  - name: pwd
    binary: workspace/scripts/bin/pwd
    description: AMI root directory finder
    category: core
    features:
      - find root
      - export AMI_ROOT
    hidden: true
    bannerPriority: 70
    check:
      command: ["{binary}", "--help"]
      healthExpect: "pwd"
      timeout: 5
