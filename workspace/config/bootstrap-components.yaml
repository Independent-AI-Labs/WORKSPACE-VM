# Bootstrap component manifest - loaded by ami/scripts/bootstrap_component_defs.py
# and ami/scripts/bootstrap_installer.py (via inline Python YAML parsing).
#
# Single source of truth for:
#   1. Bootstrap components (components) - installed by make install / make install-ci
#   2. Workspace repos - in workspace-clones.yaml, loaded via the same Python module
#
# System dependencies (apt-level) have moved to config/system-deps.yaml and are
# checked by CI's scripts/install-system-deps (called from the Makefile init
# target). This file no longer contains requires: sections.
#
# Component fields:
#   name           - stable identifier (used by install-defaults.yaml refs).
#   label          - short human label.
#   description    - one-line description.
#   type           - script | uv | workspace_repo. Determines installer path.
#   script         - bash script under ami/scripts/bootstrap/ (script type only).
#   detect_path    - relative path; existence => installed.
#   version_cmd    - argv to invoke for version detection (relative to repo root).
#   version_pattern- regex with one capture group; first match wins.
#   detect_cmd     - alternative argv when detect_path is unreliable.
#   package_ref    - npm package name; version is resolved from scripts/package.json.

groups:
  - 'Core Dependencies'
  - 'Languages & Compilers'
  - 'Hardware Monitoring'
  - 'AI Coding Assistants'
  - 'Infrastructure & Orchestration'
  - 'Cloud & Service CLIs'
  - 'Networking'
  - 'Shell Utilities'
  - 'Document Processing'
  - 'Browser & Device Automation'
  - 'Matrix & Communication'

components:
  # =========================================================================
  # Core Dependencies
  # =========================================================================
  - name: uv
    label: 'uv'
    description: 'Python package manager'
    type: script
    group: 'Core Dependencies'
    script_path: 'projects/CI/scripts/bootstrap-uv'
    detect_path: 'projects/CI/.boot-linux/bin/uv'
    version_cmd: ['projects/CI/.boot-linux/bin/uv', '--version']
    version_pattern: 'uv (\d+\.\d+\.\d+)'

  - name: python
    label: 'Python'
    description: 'Python venv for .boot-linux'
    type: script
    group: 'Core Dependencies'
    script: 'bootstrap_python.sh'
    detect_path: '.boot-linux/python-env/bin/python'
    version_cmd: ['.boot-linux/bin/python', '--version']
    version_pattern: 'Python (\d+\.\d+\.\d+)'

  - name: gcc
    label: 'GCC/musl'
    description: 'C compiler (static toolchain)'
    type: script
    group: 'Core Dependencies'
    script: 'bootstrap_gcc.sh'
    detect_path: '.boot-linux/bin/gcc'
    version_cmd: ['.boot-linux/bin/gcc', '--version']
    version_pattern: 'gcc.*?(\d+\.\d+\.\d+)'

  - name: git_xet
    label: 'Git Xet'
    description: 'HuggingFace large file storage'
    type: script
    group: 'Core Dependencies'
    script: 'bootstrap_git_xet.sh'
    detect_path: '.boot-linux/bin/git-lfs'
    version_cmd: ['.boot-linux/bin/git-lfs', '--version']
    version_pattern: 'git-lfs/(\d+\.\d+\.\d+)'

  - name: moon
    label: 'moon (workspace)'
    description: 'Workspace task runner and dep-graph validator (moonrepo)'
    type: script
    group: 'Core Dependencies'
    script_path: 'projects/CI/scripts/bootstrap-moon'
    detect_path: 'projects/CI/.boot-linux/bin/moon'
    version_cmd: ['projects/CI/.boot-linux/bin/moon', '--version']
    version_pattern: 'moon (\d+\.\d+\.\d+)'

  - name: node
    label: 'Node.js'
    description: 'Node.js + npm (hermetic, official tarball)'
    type: script
    group: 'Core Dependencies'
    script_path: 'projects/CI/scripts/bootstrap-node'
    detect_path: 'projects/CI/.boot-linux/bin/node'
    version_cmd: ['projects/CI/.boot-linux/bin/node', '--version']
    version_pattern: 'v(\d+\.\d+\.\d+)'

  - name: gitleaks
    label: 'Gitleaks'
    description: 'Secret scanning (pre-commit hook)'
    type: script
    group: 'Core Dependencies'
    script_path: 'projects/CI/scripts/bootstrap-gitleaks'
    detect_path: 'projects/CI/.boot-linux/bin/gitleaks'
    version_cmd: ['projects/CI/.boot-linux/bin/gitleaks', 'version']
    version_pattern: '(\d+\.\d+\.\d+)'

  - name: hooks
    label: 'Git Hooks'
    description: 'Pre-commit, commit-msg, and pre-push hooks'
    type: script
    group: 'Core Dependencies'
    script: 'bootstrap_hooks.sh'
    detect_cmd:
      - 'bash'
      - '-c'
      - 'test -x .git/hooks/pre-commit && test -x .git/hooks/commit-msg && test -x .git/hooks/pre-push && grep -q "AUTO-GENERATED by projects/CI/scripts/generate-hooks" .git/hooks/pre-commit'

  # =========================================================================
  # Languages & Compilers
  # =========================================================================
  - name: go
    label: 'Go'
    description: 'Go language'
    type: script
    group: 'Languages & Compilers'
    script: 'bootstrap_go.sh'
    detect_path: '.boot-linux/go/bin/go'
    version_cmd: ['.boot-linux/go/bin/go', 'version']
    version_pattern: 'go(\d+\.\d+\.\d+)'

  - name: rust
    label: 'Rust'
    description: 'Rust language & Cargo'
    type: script
    group: 'Languages & Compilers'
    script_path: 'projects/CI/scripts/bootstrap-rust'
    detect_path: 'projects/CI/.boot-linux/bin/cargo'
    version_cmd: ['projects/CI/.boot-linux/bin/rustc', '--version']
    version_pattern: 'rustc (\d+\.\d+\.\d+)'

  # =========================================================================
  # AI Coding Assistant
  # =========================================================================
  - name: opencode
    label: 'opencode'
    description: 'opencode AI agent'
    type: script
    group: 'AI Coding Assistants'
    script: 'bootstrap_opencode.sh'
    detect_path: '.boot-linux/bin/opencode'
    version_cmd: ['.boot-linux/bin/opencode', '--version']
    version_pattern: '(\d+\.\d+\.\d+)'

  # =========================================================================
  # Hardware Monitoring
  # =========================================================================
  - name: intel_xpu_smi
    label: 'Intel XPU-SMI'
    description: 'Intel GPU monitoring & diagnostics (Arc A770, Flex, Max)'
    type: script
    group: 'Hardware Monitoring'
    script: 'bootstrap_intel_xpu_smi.sh'
    detect_path: '/usr/bin/xpu-smi'
    version_cmd: ['/usr/bin/xpu-smi', '-v']
    version_pattern: 'v?(\d+\.\d+\.\d+)'

  # =========================================================================
  # Infrastructure & Orchestration
  # =========================================================================
  - name: podman
    label: 'Podman'
    description: 'Container runtime (rootless, daemonless)'
    type: script
    group: 'Infrastructure & Orchestration'
    script_path: 'projects/CI/scripts/bootstrap-podman'
    detect_path: 'projects/CI/.boot-linux/bin/podman'
    version_cmd: ['projects/CI/.boot-linux/bin/podman', '--version']
    version_pattern: 'podman version (\d+\.\d+\.\d+)'

  - name: traefik
    label: 'Traefik'
    description: 'Reverse proxy (per-VM mTLS)'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_traefik.sh'
    detect_path: '.boot-linux/bin/traefik'
    version_cmd: ['.boot-linux/bin/traefik', 'version']
    version_pattern: 'Version:\s*(\d+\.\d+\.\d+)'

  - name: kubernetes
    label: 'Kubernetes'
    description: 'k8s tools (kubectl, helm)'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_kubernetes.sh'
    detect_path: '.boot-linux/bin/kubectl'
    version_cmd: ['.boot-linux/bin/kubectl', 'version', '--client', '-o', 'json']
    version_pattern: '"gitVersion":\s*"v?(\d+\.\d+\.\d+)"'

  - name: ansible
    label: 'Ansible'
    description: 'Infrastructure as Code / config management'
    type: script
    group: 'Infrastructure & Orchestration'
    script_path: 'projects/CI/scripts/bootstrap-ansible'
    detect_path: 'projects/CI/.boot-linux/bin/ansible-playbook'
    version_cmd: ['projects/CI/.boot-linux/bin/ansible', '--version']
    version_pattern: 'ansible.*?(\d+\.\d+\.\d+)'

  - name: qemu
    label: 'QEMU'
    description: 'VM hypervisor for make vm qemu backend (GPL-2.0, subprocess only)'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_qemu.sh'
    detect_path: '.boot-linux/bin/qemu-system-aarch64'
    version_cmd: ['.boot-linux/bin/qemu-system-aarch64', '--version']
    version_pattern: 'QEMU emulator version (\d+\.\d+\.\d+)'

  - name: cron
    label: 'Cron'
    description: 'AMI crontab manager via system cron package'
    type: script
    group: 'Infrastructure & Orchestration'

    script: 'bootstrap_cron.sh'
    detect_path: '.boot-linux/bin/cron'
    version_cmd: ['dpkg-query', '-W', '-f=${Version}', 'cron']
    version_pattern: '(\d+\.\S+)'

  - name: llama_cpu
    label: 'llama.cpp (CPU)'
    description: 'LLM inference server - CPU backend'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_llama_cpu.sh'
    detect_path: 'projects/llama.cpp/build-cpu/bin/llama-server'
    version_cmd: ['projects/llama.cpp/build-cpu/bin/llama-server', '--version']
    version_pattern: '(\d+\.\d+)'

  - name: llama_sycl
    label: 'llama.cpp (SYCL)'
    description: 'LLM inference server - Intel oneAPI SYCL backend'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_llama_sycl.sh'
    detect_path: 'projects/llama.cpp/build-sycl/bin/llama-server'
    version_cmd: ['projects/llama.cpp/build-sycl/bin/llama-server', '--version']
    version_pattern: '(\d+\.\d+)'

  - name: llama_vulkan
    label: 'llama.cpp (Vulkan)'
    description: 'LLM inference server - Vulkan compute backend'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_llama_vulkan.sh'
    detect_path: 'projects/llama.cpp/build-vulkan/bin/llama-server'
    version_cmd: ['projects/llama.cpp/build-vulkan/bin/llama-server', '--version']
    version_pattern: '(\d+\.\d+)'

  - name: llamafile_vulkan
    label: 'llamafile (Vulkan DSO)'
    description: 'Portable llamafile ggml-vulkan.so backend (projects/llamafile/)'
    type: script
    group: 'Infrastructure & Orchestration'
    script: 'bootstrap_llamafile_vulkan.sh'
    detect_path: 'projects/llamafile/o/llamafile/ggml-vulkan.so'
    version_cmd: ['ls', '-lh', 'projects/llamafile/o/llamafile/ggml-vulkan.so']
    version_pattern: 'ggml-vulkan'

  # =========================================================================
  # Cloud & Service CLIs
  # =========================================================================
  - name: gcloud
    label: 'Google Cloud CLI'
    description: 'Google Cloud SDK (gcloud)'
    type: script
    group: 'Cloud & Service CLIs'
    script: 'bootstrap_gcloud.sh'
    detect_path: '.boot-linux/bin/gcloud'
    version_cmd: ['.gcloud/google-cloud-sdk/bin/gcloud', 'version', '--format=json']
    version_pattern: '"Google Cloud SDK":\s*"(\d+\.\d+\.\d+)"'

  - name: gh
    label: 'GitHub CLI'
    description: 'GitHub API client'
    type: script
    group: 'Cloud & Service CLIs'
    script: 'bootstrap_gh.sh'
    detect_path: '.boot-linux/bin/gh'
    version_cmd: ['.boot-linux/bin/gh', '--version']
    version_pattern: 'gh version (\d+\.\d+\.\d+)'

  - name: huggingface
    label: 'HuggingFace CLI'
    description: 'HuggingFace Hub client'
    type: script
    group: 'Cloud & Service CLIs'
    script: 'bootstrap_hf.sh'
    detect_path: '.boot-linux/python-env/bin/hf'
    version_cmd: ['.boot-linux/python-env/bin/hf', 'version']
    version_pattern: '(\d+\.\d+\.\d+)'

  - name: gitlab
    label: 'GitLab CLI'
    description: 'GitLab API client'
    type: script
    group: 'Cloud & Service CLIs'
    script: 'bootstrap_gitlab.sh'
    detect_path: '.boot-linux/bin/glab'
    version_cmd: ['.boot-linux/bin/glab', '--version']
    version_pattern: 'glab version (\d+\.\d+\.\d+)'

  # =========================================================================
  # Networking
  # =========================================================================
  - name: cloudflared
    label: 'Cloudflared'
    description: 'Cloudflare tunnel client'
    type: script
    group: 'Networking'
    script: 'bootstrap_cloudflared.sh'
    detect_path: '.boot-linux/bin/cloudflared'
    version_cmd: ['.boot-linux/bin/cloudflared', '--version']
    version_pattern: '(\d+\.\d+\.\d+)'

  - name: openvpn
    label: 'OpenVPN'
    description: 'OpenVPN CLI client + platform host service (see docs/SPEC-OPENVPN.md)'
    type: script
    group: 'Networking'
    script: 'bootstrap_openvpn.sh'
    detect_path: '.boot-linux/bin/openvpn'
    version_cmd: ['.boot-linux/bin/openvpn', '--version']
    version_pattern: 'OpenVPN (\d+\.\d+\.\d+)'

  # =========================================================================
  # Shell Utilities
  # =========================================================================
  - name: sd
    label: 'sd'
    description: 'Modern sed replacement'
    type: script
    group: 'Shell Utilities'
    script: 'bootstrap_sd.sh'
    detect_path: '.boot-linux/bin/sd'
    version_cmd: ['.boot-linux/bin/sd', '--version']
    version_pattern: 'sd (\d+\.\d+\.\d+)'

  - name: cloc
    label: 'cloc'
    description: 'Count Lines of Code'
    type: script
    group: 'Shell Utilities'
    script_path: 'projects/CI/scripts/bootstrap-cloc'
    detect_path: 'projects/CI/.boot-linux/bin/cloc'
    version_cmd: ['projects/CI/.boot-linux/bin/cloc', '--version']
    version_pattern: '(\d+\.\d+)'

  # =========================================================================
  # Document Processing
  # =========================================================================
  - name: pandoc
    label: 'Pandoc'
    description: 'Document converter'
    type: script
    group: 'Document Processing'
    script: 'bootstrap_pandoc.sh'
    detect_path: '.boot-linux/bin/pandoc'
    version_cmd: ['.boot-linux/bin/pandoc', '--version']
    version_pattern: 'pandoc (\d+\.\d+\.\d+)'

  - name: texlive
    label: 'TeX Live'
    description: 'LaTeX distribution'
    type: script
    group: 'Document Processing'
    script: 'bootstrap_texlive.sh'
    detect_path: '.boot-linux/texlive'
    detect_cmd: ['.boot-linux/bin/pdflatex', '--version']
    version_pattern: 'pdfTeX (\d+\.\d+)'

  - name: pdfjam
    label: 'PDFjam'
    description: 'PDF manipulation'
    type: script
    group: 'Document Processing'
    script: 'bootstrap_pdfjam.sh'
    detect_path: '.boot-linux/bin/pdfjam'
    version_cmd: ['.boot-linux/bin/pdfjam', '--version']
    version_pattern: 'pdfjam (\d+\.\d+)'

  - name: wkhtmltopdf
    label: 'wkhtmltopdf'
    description: 'HTML to PDF'
    type: script
    group: 'Document Processing'
    script: 'bootstrap_wkhtmltopdf.sh'
    detect_path: '.boot-linux/bin/wkhtmltopdf'
    version_cmd: ['.boot-linux/bin/wkhtmltopdf', '--version']
    version_pattern: 'wkhtmltopdf (\d+\.\d+\.\d+)'

  # =========================================================================
  # Browser & Device Automation
  # =========================================================================
