# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# moon project config for ami-agents (workspace umbrella repo).
# Workspace-level overlay only — see projects/docs/MOON-MIGRATION-PLAN.md.
# Per-repo tasks (lint, test, build, install, etc.) live in the Makefile
# and are invoked directly when working inside this repo. moon does not
# duplicate them.

$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'ami-agents'
  description: 'AMI workspace umbrella repo and Python orchestrator'

language: 'python'
layer: 'unknown'

tags:
  - 'umbrella'
  - 'python'

# Workspace-clone manifest. Read by ami/scripts/bin/ami-bootstrap-repos
# to clone-if-missing each declared workspace repo. Mandatory entries
# always clone; optional entries opt-in via the bootstrap TUI or
# `--include <id>` CLI flag. minTag (when present) is enforced after
# clone — abort if the cloned working tree's nearest tag is older.
#
# This block is the SINGLE source of truth for "what repos belong to
# the AMI workspace." Children's moon.yml files do NOT carry per-repo
# clone metadata (chicken-egg: at install time only this file is on
# disk, so reaching into children would fail).
metadata:
  workspaceClones:
    ami-ci:
      remote: 'git@github.com:Independent-AI-Labs/AMI-CI.git'
      path: 'projects/AMI-CI'
      mandatory: true
    ami-dataops:
      remote: 'git@github.com:Independent-AI-Labs/AMI-DATAOPS.git'
      path: 'projects/AMI-DATAOPS'
      mandatory: true
    ami-docs:
      remote: 'git@github.com:Independent-AI-Labs/AMI-DOCS.git'
      path: 'projects/docs'
      mandatory: false
    ami-portal:
      remote: 'git@github.com:Independent-AI-Labs/AMI-PORTAL.git'
      path: 'projects/AMI-PORTAL'
      mandatory: false
    ami-srp:
      remote: 'git@github.com:Independent-AI-Labs/AMI-SRP.git'
      path: 'projects/AMI-SRP'
      mandatory: false
    ami-browser:
      remote: 'git@github.com:Independent-AI-Labs/AMI-BROWSER.git'
      path: 'projects/AMI-BROWSER'
      mandatory: false
    ami-streams:
      remote: 'git@github.com:Independent-AI-Labs/AMI-STREAMS.git'
      path: 'projects/AMI-STREAMS'
      mandatory: false
    ami-trading:
      remote: 'git@github.com:Independent-AI-Labs/AMI-TRADING.git'
      path: 'projects/AMI-TRADING'
      mandatory: false
    rust-trading:
      remote: 'git@github.com:Independent-AI-Labs/RUST-TRADING.git'
      path: 'projects/RUST-TRADING'
      mandatory: false
    zk-portal:
      remote: 'git@github.com:Independent-AI-Labs/ZK-PORTAL.git'
      path: 'projects/ZK-PORTAL'
      mandatory: false
    polymarket-tracker:
      remote: 'git@github.com:Independent-AI-Labs/polymarket-insider-tracker.git'
      path: 'projects/polymarket-insider-tracker'
      mandatory: false

dependsOn:
  - 'ami-ci'
  - 'ami-dataops'

tasks:
  lint:
    command: 'make _lint-impl'
    inputs:
      - 'ami/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'pyproject.toml'
      - 'res/config/ruff.toml'
      - 'Makefile'
  type-check:
    command: 'make _type-check-impl'
    inputs:
      - 'ami/**/*.py'
      - 'pyproject.toml'
      - 'res/config/mypy.toml'
      - 'Makefile'
  test:
    command: 'make _test-impl'
    inputs:
      - 'ami/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'res/**/*'
      - 'pyproject.toml'
      - 'Makefile'
  dead-code:
    command: 'make _dead-code-impl'
    inputs:
      - 'ami/**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
  check:
    # Aggregator: deps fan out via moon's task DAG; command is a no-op
    # to avoid recursing back through the public make check shim.
    command: 'true'
    deps:
      - '~:lint'
      - '~:type-check'
      - '~:test'
  ci:
    command: 'make check'
    deps:
      - '~:check'
  update:
    command: 'bash -c "git pull --ff-only 2>/dev/null || true && make sync"'
    deps:
      - '^:update'
    options:
      cache: false
      runDepsInParallel: false
