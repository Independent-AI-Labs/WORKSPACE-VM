# VM configuration - passed to `make vm <config.yaml>`
# Only `components` is required. Everything else has defaults.
#
# This file is the canonical reference. See MIGRATION-PLAN.md §3.1 for field
# descriptions and §3.12 for implementation architecture.
# OpenVPN: docs/REQ-OPENVPN.md + docs/SPEC-OPENVPN.md

# --- Install layer ---
# Same format as install-defaults.yaml. Passed to make install-ci.
components:
  - uv
  - python
  - node
  - opencode
  # ... any component from bootstrap-components.yaml

extra_apt:
  - "htop"
  - "vim"

# --- Resources ---
resources:
  memory: "4g"
  cpus: 2
  pids_limit: 256

# --- Provider ---
# Baked into the container's generated opencode.json. Models are NOT baked in.
provider:
  name: llama.cpp
  options:
    base_url: "http://llamaserver:8080/v1"

# --- Credentials ---
credentials:
  mode: none  # none | clone | api

# --- SSH & Host Configs ---
ssh:
  mode: none  # none | inherit | custom

# --- Filesystem ---
files: []
sync: []
mounts: []

# --- Network ---
# DEFAULT: none - container has zero network interfaces (fully air-gapped).
network:
  mode: none  # none | bridge | host | openvpn

# OpenVPN example (container mode, works on macOS and Linux):
# network:
#   mode: openvpn
#   vpn_type: container
#   vpn_config: workspace/config/vpn/client.ovpn
#   vpn_auth: workspace/config/vpn/auth.txt  # optional
# Place configs in workspace/config/vpn/ (gitignored). See docs/SPEC-OPENVPN.md.

# OpenVPN example (netns mode, Linux host only):
# network:
#   mode: openvpn
#   vpn_type: netns
#   vpn_netns: workspace-vpn
#   vpn_config: workspace/config/vpn/client.ovpn

# --- Runtime ---
web_ui: true
env:
  OPENCODE_ENABLE_EXA: "1"

# --- Isolation backend ---
# Default podman: rootless agent containers (existing behaviour).
# Use qemu for a full Linux guest (WORKSPACE-GUARD cap/kernel E2E).
# See docs/REQ-VM-HYPERVISOR.md and docs/SPEC-VM-HYPERVISOR.md.
isolation:
  backend: podman  # podman | qemu
  qemu:
    guest_arch: aarch64   # aarch64 | x86_64 (defaults to host CPU)
    accel: auto           # auto | kvm | hvf | whpx | tcg
    disk_gb: 20
    ssh_host_port: 0      # 0 = allocate a free localhost port
    image: workspace-vm-base-ubuntu-24.04-aarch64.qcow2

# --- Security ---
security:
  purge_sudo: true
  no_new_privileges: true
  read_only_rootfs: true
  cap_drop:
    - "ALL"
  cap_add: []
