# Default components to install in CI/non-interactive mode
# Used by: make install-ci
# Edit this file to change which components are installed by default
#
# NOTE: Only include components that bootstrap from direct downloads.
# System dependencies (git, openssh, openssl, openvpn) are checked by pre-req.sh
# and installed via: sudo make pre-req

components:
  # Core Dependencies (installed FIRST)
  - uv
  - python

  # AI Coding Assistants
  - claude
  - gemini
  - qwen

  # Containers & Orchestration
  - podman

  # Development Tools
  - gh
  - go

  # Security & Networking
  - cloudflared

  # Browser & Device Automation
  - playwright

  # Document Processing
  - pandoc
  - texlive

  # Miscellaneous
  - adb
  - ansible

  # Workspace Repositories (data-driven from ami/config/workspace-clones.yaml)
  # Mandatory entries (ami-ci, ami-dataops) clone via the bootstrap-repos
  # walker regardless of this list. To pre-select OPTIONAL workspace repos in
  # CI mode, add their IDs below — for example:
  #   - ami-portal
  #   - ami-srp
  # By default no optional repos are pre-selected; CI installs only the
  # mandatory pair.
