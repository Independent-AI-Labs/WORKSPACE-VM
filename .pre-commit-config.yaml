repos:
  - repo: local
    hooks:
      - id: check-unstaged
        name: Block Unstaged Changes
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_unstaged'"
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --config projects/CI/ruff.toml .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --config projects/CI/ruff.toml --fix --exit-non-zero-on-fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: block-sensitive-files
        name: Block Sensitive Files
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_block_sensitive_files'"
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Block secrets in all files (gitleaks)
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_scan_secrets'"
        language: system
        pass_filenames: false
        always_run: true
      - id: ci-check-silent-swallow
        name: Block silent error-swallow patterns (all files)
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_silent_swallow'"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-dependency-versions
        name: Check Dependency Versions (strict pinning + latest)
        entry: "bash -c 'source projects/CI/lib/checks.sh && _uv_bin=\"$(ci_uv_bin)\" && _uv_dir=\"${_uv_bin%/*}\" && export PATH=\"$_uv_dir:$PATH\" && CI_CONFIG_DIR=\"$CI_CONFIG_DIR\" CI_PROJECT_ROOT=\"$CI_PROJECT_ROOT\" exec uv run --project projects/CI --no-sync python -m ci.check_dependency_versions \"$@\"' --"
        language: system
        pass_filenames: false
        always_run: true

      - id: check-duplicate-dependencies
        name: Check Duplicate/Redundant Dependencies
        entry: "bash -c 'source projects/CI/lib/checks.sh && _uv_bin=\"$(ci_uv_bin)\" && _uv_dir=\"${_uv_bin%/*}\" && export PATH=\"$_uv_dir:$PATH\" && CI_CONFIG_DIR=\"$CI_CONFIG_DIR\" CI_PROJECT_ROOT=\"$CI_PROJECT_ROOT\" exec uv run --project projects/CI --no-sync python -m ci.check_duplicate_dependencies \"$@\"' --"
        language: system
        pass_filenames: false
        always_run: true

      - id: check-banned-words
        name: Check Banned Words
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_banned_words \"$@\"' _"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-coverage-no-devolution
        name: Block Coverage Threshold De-Evolution
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_coverage_thresholds_no_devolution'"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-file-length
        name: Check File Length (max 512 lines)
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_file_length'"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-markdown-docs
        name: Check Markdown Documentation References
        entry: "bash -c 'source projects/CI/lib/checks.sh && _uv_bin=\"$(ci_uv_bin)\" && _uv_dir=\"${_uv_bin%/*}\" && export PATH=\"$_uv_dir:$PATH\" && CI_CONFIG_DIR=\"$CI_CONFIG_DIR\" CI_PROJECT_ROOT=\"$CI_PROJECT_ROOT\" exec uv run --project projects/CI --no-sync python -m ci.check_markdown_docs --all-md --check-remote \"$@\"' --"
        language: system
        pass_filenames: false
        always_run: true

      - id: check-init-files
        name: Enforce Empty __init__.py Files
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_init_files'"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-py-not-executable
        name: Forbid +x bit on .py modules
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_py_not_executable'"
        language: system
        pass_filenames: false
        always_run: true
      - id: check-no-dead-imports
        name: Forbid deleting .py modules that are still imported
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_no_dead_imports'"
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: make _type-check-impl
        language: system
        pass_filenames: false
        always_run: true

      - id: check-commit-message
        name: Check Commit Message Format
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_check_commit_message \"$1\"' --"
        language: system
        stages: [commit-msg]
      - id: block-coauthored
        name: Block Co-authored Commits
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_block_coauthored \"$1\"' --"
        language: system
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ci-check-push
        name: Pre-push Quality Gate (lint + type + tests)
        entry: "make check-push"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: block-coauthored-history
        name: Block Commits with Blocked Patterns (full history scan)
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_block_coauthored_history'"
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: verify-coverage
        name: Verify Test Coverage (Unit >90%, Integration >75%)
        entry: "bash -c 'source projects/CI/lib/checks.sh && ci_verify_coverage'"
        language: system
        stages: [pre-push]
        pass_filenames: false
