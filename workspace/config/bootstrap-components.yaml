    group: 'Matrix & Communication'
    script: 'bootstrap_synadm.sh'
    detect_path: '.boot-linux/bin/synadm'
    version_cmd: ['.boot-linux/bin/synadm', '--version']
    version_pattern: '(\d+\.\d+\.\d+)'
