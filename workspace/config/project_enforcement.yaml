# project_enforcement.yaml - workspace-level tier registry.
#
# This file is the PER-MACHINE COPY of the WORKSPACE-CI enforcement template. It
# is gitignored at the workspace root; it gets autocreated from
# projects/CI/templates/project_enforcement.template.yaml on first need
# (by the git-guard wrapper, by generate-hooks, or by any *-recursive
# Makefile target). Edit it to add machine-local overrides.
#
# Tier resolution is path-prefix-keyed with most-specific-match-wins. A
# nested git repo at any depth under projects/ inherits its parent path's
# tier unless a more-specific entry overrides it.
#
# Tiers:
#   strict    - full contract: all mandatory hooks installed,
#               quality_exceptions.yaml required, lint+type-check+make-check
#               required. Wrapper enforces all gates. (Default for any
#               path not matched below.)
#   poc       - safety subset only: gitleaks, sensitive-files, banned-words,
#               blocked-history, commit-message format. No
#               quality_exceptions.yaml required, no lint/type/check.
#   vendored  - wrapper passthrough; no hooks installed at all. Use for
#               git-subtree mirrors and frozen legacy code.

version: 1

# Global enforcement mode. The git-guard wrapper consults this on every
# commit/push in an in-scope project. See template for full docs.
#
#   warn     - yellow advisory on violations, do NOT block (rollout phases 1-2)
#   enforce  - hard-block commit/push on any contract violation (phase 3)
#
# Per-machine: gitignored, so boxes can be at different rollout phases.
# Default when absent: warn.
enforcement_mode: warn

defaults:
  tier: strict

exemptions:
  # POC / exploratory repo - path matches the on-disk directory name.
  - path: projects/polymarket-insider-tracker/
    tier: poc
    reason: "POC; insider-tracking reference implementation, not a production target"

  # Pure-markdown / docs repo - no Makefile, no test surface.
  - path: projects/docs/
    tier: poc
    reason: "Pure-markdown documentation repo; no build/test/lint surface"

  # Third-party research mirrors under AMI-SRP - git subtrees we don't
  # modify; treat as vendored so wrapper passes through.
  - path: projects/AMI-SRP/research/
    tier: vendored
    reason: "Third-party research code mirrors; not part of the AMI contract"

  # pimalaya-core fork under WORKSPACE-STREAMS - tracks pimalaya/core upstream
  # via a separate origin (Independent-AI-Labs/core); WORKSPACE-STREAMS does
  # not manage its hooks. Vendored here so the workspace wrapper passes
  # commits through to the fork's own development cadence.
  - path: projects/WORKSPACE-STREAMS/pimalaya-core/
    tier: vendored
    reason: "Fork of pimalaya/core; tracked upstream, WORKSPACE-STREAMS does not manage its CI"
