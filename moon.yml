# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# moon project config for workspace (workspace umbrella repo).
# Workspace-level overlay only — see projects/docs/MOON-MIGRATION-PLAN.md.
# Per-repo tasks (lint, test, build, install, etc.) live in the Makefile
# and are invoked directly when working inside this repo. moon does not
# duplicate them.

$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'workspace'
  description: 'AMI workspace umbrella repo and Python orchestrator'

language: 'python'
layer: 'unknown'

tags:
  - 'umbrella'
  - 'python'

# Workspace clone manifest lives in workspace/config/workspace-clones.yaml
# (moon.yml schema doesn't accept arbitrary top-level metadata fields).
# That separate file is the single source of truth for "what repos
# belong to the AMI workspace" — read by workspace/scripts/bin/bootstrap-repos.

dependsOn:
  - 'ci'
  - 'dataops'

tasks:
  lint:
    command: 'make _lint-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'pyproject.toml'
      - 'res/config/ruff.toml'
      - 'Makefile'
  type-check:
    command: 'make _type-check-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'pyproject.toml'
      - 'res/config/mypy.toml'
      - 'Makefile'
  test:
    command: 'make _test-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*'
      - 'res/**/*'
      - 'pyproject.toml'
      - 'Makefile'
  dead-code:
    command: 'make _dead-code-impl'
    inputs:
      - 'workspace/**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
  workspace-repos-aligned:
    # Asserts .moon/workspace.yml::projects and workspace/config/workspace-clones.yaml
    # reference the same repos with the same paths. Drift = split-brain
    # between moon (update graph) and the bootstrap installer (clone graph).
    command: 'uv run python workspace/scripts/check_workspace_repos_aligned.py'
    inputs:
      - '.moon/workspace.yml'
      - 'workspace/config/workspace-clones.yaml'
      - 'workspace/scripts/check_workspace_repos_aligned.py'
  check:
    # Aggregator: deps fan out via moon's task DAG; command is a no-op
    # to avoid recursing back through the public make check shim.
    command: 'true'
    deps:
      - '~:lint'
      - '~:type-check'
      - '~:test'
      - '~:workspace-repos-aligned'
  ci:
    command: 'make check'
    deps:
      - '~:check'
  update:
    command: 'bash -c "git pull --ff-only 2>/dev/null || true && make sync"'
    deps:
      - '^:update'
    options:
      cache: false
      runDepsInParallel: false
