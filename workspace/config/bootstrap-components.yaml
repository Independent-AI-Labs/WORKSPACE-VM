    group: 'Browser & Device Automation'
    script: 'bootstrap_playwright.sh'
    detect_path: '.boot-linux/playwright-browsers'
    version_cmd: ['.venv/bin/playwright', '--version']
    version_pattern: '(\d+\.\d+\.\d+)'

