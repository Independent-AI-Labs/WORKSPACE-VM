[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ami-agents"
version = "0.3.0"
description = "AMI Agent Orchestration System with shared code quality infrastructure"
readme = "README.md"
requires-python = "==3.11.*"
license = {text = "MIT"}
authors = [{name = "AMI Team", email = "ami@example.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "uuid-utils==0.15.0",
    "loguru==0.7.3",
    "pandas==2.2.3",
    "numpy==2.4.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "click==8.4.0",
    "setuptools==80.10.2",
    "matrix-nio==0.25.2",
    "matrix-commander==8.0.5",
    "python-dotenv==1.2.2",
    "prometheus-client==0.25.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "rfc8785==0.1.4",
    "python-multipart==0.0.29",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "nodeenv==1.10.0",
    "playwright==1.59.0",
    "synadm==0.49.2",
    "google-auth==2.53.0",
    "google-auth-oauthlib==1.4.0",
    "google-api-python-client==2.196.0",
    "tqdm==4.67.3",
    "zstandard==0.25.0",
    "pyahocorasick==2.3.1",
    "podman-compose==1.5.0",
    "art==6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `-n 1` runs the suite in a single xdist worker process so test bodies
# execute outside the main pytest interpreter. Without this, coverage.py's
# C tracer plus the YAML-loading test
# tests/integration/test_hooks_integration.py::TestHookIntegration::test_tier_scope_override_elevates
# segfault when run in the same process. Costs one fork; restores
# deterministic test runs under `--cov`.
addopts = "-n 1"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ami.*"]
namespaces = true

[tool.setuptools.package-data]
ami = [
    "res/config/*.toml",
    "res/config/*.yaml",
]

[project.optional-dependencies]
dev = [
    "ami-ci[dev]",
]

[tool.uv]
package = true

[tool.uv.sources]
ami-ci = { path = "projects/AMI-CI", editable = true }

[tool.mypy]
# Config is in res/config/mypy.toml - mypy will auto-discover it
# NO CHEATING. All files must pass type checking.
exclude = [
    "projects/",
]
explicit_package_bases = true

