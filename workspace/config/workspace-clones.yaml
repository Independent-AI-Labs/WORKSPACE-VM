# Workspace clone manifest - read by workspace/scripts/bin/bootstrap-repos.
#
# Single source of truth for "what repos belong to the AMI workspace."
# Mandatory entries always clone; optional entries opt-in via
# `bootstrap-repos --include <id>,<id>` or `--all`.
# minTag (optional) - abort if the cloned working tree's nearest tag
# is older than this (forwards-compat protection).

workspaceClones:
  # Agent working repo for CI development. /opt/workspace-ci is the sealed
  # deployment consumed live by hooks; it is root-managed exclusively via
  # `sudo make deploy-ci` from this working repo, so the manifest clones
  # only WORKSPACE-CI.
  ci:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-CI.git'
    path: 'projects/WORKSPACE-CI'
    mandatory: true
  workspace-dataops:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-DATAOPS.git'
    path: 'projects/WORKSPACE-DATAOPS'
    mandatory: true
  ami-docs:
    remote: 'git@github.com:Independent-AI-Labs/AMI-DOCS.git'
    path: 'projects/docs'
    mandatory: false
  workspace-portal:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-PORTAL.git'
    path: 'projects/WORKSPACE-PORTAL'
    mandatory: false
  workspace-rp:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-RP.git'
    path: 'projects/WORKSPACE-RP'
    mandatory: false
  ami-browser:
    remote: 'git@github.com:Independent-AI-Labs/AMI-BROWSER.git'
    path: 'projects/AMI-BROWSER'
    mandatory: false
  workspace-streams:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-STREAMS.git'
    path: 'projects/WORKSPACE-STREAMS'
    mandatory: false
  ami-trading:
    remote: 'git@github.com:Independent-AI-Labs/AMI-TRADING.git'
    path: 'projects/AMI-TRADING'
    mandatory: false
  rust-trading:
    remote: 'git@github.com:Independent-AI-Labs/RUST-TRADING.git'
    path: 'projects/RUST-TRADING'
    mandatory: false
  zk-portal:
    remote: 'git@github.com:Independent-AI-Labs/ZK-PORTAL.git'
    path: 'projects/ZK-PORTAL'
    mandatory: false
  polymarket-tracker:
    remote: 'git@github.com:Independent-AI-Labs/POC-POLYMARKET-TRACKER.git'
    path: 'projects/polymarket-insider-tracker'
    mandatory: false
  workspace-guard:
    remote: 'git@github.com:Independent-AI-Labs/WORKSPACE-GUARD.git'
    path: 'projects/WORKSPACE-GUARD'
    mandatory: true
